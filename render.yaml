services:
  - type: web
    name: test-impact-demo
    runtime: node
    plan: free
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm build
    startCommand: corepack pnpm start
    envVars:
      - key: NODE_VERSION
        value: 24.15.0
    healthCheckPath: /api/health
    autoDeploy: true
